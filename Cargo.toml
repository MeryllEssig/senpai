[package]
name = "senpai"
version = "0.1.0"
edition = "2024"
description = "Project-scoped declarative context for coding agents"

[[bin]]
name = "senpai"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"
jsonschema = "0.37"
libc = "0.2"

[dev-dependencies]
